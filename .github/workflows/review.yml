name: Process my taps

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub often delays this; fine for our purposes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealbot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Handle button taps and reasons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/process_callbacks.py

      - name: Commit state
        run: |
          git config user.name  "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: decisions $(date -u +%FT%H:%M)"
          git pull --rebase --autostash
          git push
