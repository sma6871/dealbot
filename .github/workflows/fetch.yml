name: Fetch and score deals

on:
  schedule:
    - cron: "0 7 * * *"   # 09:00 Berlin summer / 08:00 winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealbot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser

      - name: Fetch, score, send for review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/fetch_and_score.py

      - name: Commit state
        run: |
          git config user.name  "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: candidates $(date -u +%F)"
          git pull --rebase --autostash
          git push
