name: Sync log and health check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealbot-log
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Health check and drain decisions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: python scripts/sync_log.py

      - name: Commit log
        run: |
          git config user.name  "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          git add data/log.csv
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync decisions $(date -u +%FT%H:%M)"
          git pull --rebase --autostash
          git push
